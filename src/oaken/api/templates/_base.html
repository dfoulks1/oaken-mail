{# The frame every console page shares. The header is a small logo, the wordmark and plain links;
   the home page swaps it for a bare bar and shows the logo large. No script: the only <script>
   a page may carry is /refresh.js, and only when it sets data-refresh on <body>. #}
<!doctype html>
<html lang="en" data-palette="{{ look.palette }}" data-mode="{{ look.mode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Oaken Mail{% endblock %}</title>
  <link rel="icon" type="image/png" href="/oaken-logo.png">
  <link rel="stylesheet" href="/oaken.css?v={{ css_version }}">
</head>
<body{% block body_attrs %}{% endblock %}>
{% import "_macros.html" as m with context %}
<a class="skip" href="#main">Skip to the page</a>
{% include "_icons.html" %}
{% block header %}
<header class="hd">
  <a class="brand" href="/" aria-label="Oaken Mail home">
    <img class="logo" src="/oaken-logo.png" width="196" height="128" alt="">
    <span class="wordmark">Oaken<span>Mail</span></span>
  </a>
  <nav class="nav" aria-label="Pages">
    <a href="/stats"{% if active == "stats" %} aria-current="page"{% endif %}>Status</a>
    <a href="/jobs"{% if active == "jobs" %} aria-current="page"{% endif %}>Jobs</a>
    <a href="/config"{% if active == "config" %} aria-current="page"{% endif %}>Config</a>
    <a href="{{ docs_url }}" target="_blank" rel="noopener">Docs {{ m.icon("external") }}</a>
  </nav>
  {% include "_theme.html" %}
</header>
{% endblock %}
<div class="wrap">
  <main id="main">
    {% block main %}{% endblock %}
  </main>
</div>
<footer class="foot">
  <p>Oaken Mail {{ version }} · this machine only · counts and health, never mail text</p>
</footer>
{% if flash %}
<div class="toast toast-{{ flash.kind }}" role="status">
  <div>
    <p>{{ flash.text }}</p>
    {% for line in flash.details %}<p class="small muted">{{ line }}</p>{% endfor %}
  </div>
  <a class="toast-close" href="{{ here }}" aria-label="Dismiss this message">{{ m.icon("x") }}</a>
</div>
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
