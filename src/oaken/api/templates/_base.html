{# The frame every console page shares: the logo (centered and large), the page links, the
   message from the last action, and the look switcher. No script: the only <script> a page may
   carry is /refresh.js, and only when it sets data-refresh on <body>. #}
<!doctype html>
<html lang="en" data-palette="{{ look.palette }}" data-mode="{{ look.mode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Oaken Mail{% endblock %}</title>
  <link rel="icon" type="image/png" href="/oaken-logo.png">
  <link rel="stylesheet" href="/oaken.css?v={{ css_version }}">
</head>
<body{% block body_attrs %}{% endblock %}>
{% import "_macros.html" as m with context %}
<a class="skip" href="#main">Skip to the page</a>
{% include "_icons.html" %}
<header class="masthead{% block mast_class %}{% endblock %}">
  <a class="brand" href="/" aria-label="Oaken Mail home">
    <img class="logo" src="/oaken-logo.png" width="196" height="128" alt="">
  </a>
  <p class="wordmark">Oaken<span>Mail</span></p>
  {% block tagline %}{% endblock %}
</header>
<nav class="nav" aria-label="Pages">
  <a href="/"{% if active == "home" %} aria-current="page"{% endif %}>Home</a>
  <a href="/stats"{% if active == "stats" %} aria-current="page"{% endif %}>Status</a>
  <a href="/jobs"{% if active == "jobs" %} aria-current="page"{% endif %}>Jobs</a>
  <a href="/config"{% if active == "config" %} aria-current="page"{% endif %}>Config</a>
  <a href="{{ docs_url }}" target="_blank" rel="noopener">Docs {{ m.icon("external") }}</a>
  <details class="menu theme">
    <summary aria-label="Theme: {{ look.palette }}, {{ look.mode }}"><span class="sw" data-palette="{{ look.palette }}" data-mode="{{ look.mode }}"></span> Theme</summary>
    <div class="theme-pop">
      <form method="post" action="/ui/look">
        {{ m.guard(here) }}<input type="hidden" name="mode" value="{{ look.mode }}">
        <p class="eyebrow">Palette</p>
        {% for p in palettes %}
        <button class="theme-opt" type="submit" name="palette" value="{{ p }}"{% if p == look.palette %} aria-current="true"{% endif %}>
          <span class="sw" data-palette="{{ p }}" data-mode="{{ look.mode }}"></span>{{ "auto (oak)" if p == "auto" else p }}
        </button>
        {% endfor %}
      </form>
      <form method="post" action="/ui/look">
        {{ m.guard(here) }}<input type="hidden" name="palette" value="{{ look.palette }}">
        <p class="eyebrow">Mode</p>
        <div class="row">
        {% for o in modes %}<button class="btn btn-sm{% if o == look.mode %} btn-primary{% endif %}" type="submit" name="mode" value="{{ o }}">{{ o }}</button>{% endfor %}
        </div>
      </form>
    </div>
  </details>
</nav>
<div class="wrap">
  <main id="main">
    {% block main %}{% endblock %}
  </main>
  <footer class="foot">
    <p>Oaken Mail {{ version }} · served on this machine only · counts and health, never mail text</p>
  </footer>
</div>
{% if flash %}
<div class="toast toast-{{ flash.kind }}" role="status">
  <div>
    <p>{{ flash.text }}</p>
    {% for line in flash.details %}<p class="small muted">{{ line }}</p>{% endfor %}
  </div>
  <a class="toast-close" href="{{ here }}" aria-label="Dismiss this message">{{ m.icon("x") }}</a>
</div>
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
