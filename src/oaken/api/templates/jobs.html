<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobs &amp; Pipeline · OakenMail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #jobs-table td { vertical-align: middle; }
    .err { max-width: 28rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
{% include "_nav.html" with context %}

<main class="container py-4" style="max-width: 72rem;">
  <h1 class="h4 mb-3">Jobs &amp; Pipeline</h1>

  <!-- Pipeline controls -->
  <div class="card mb-3">
    <div class="card-header d-flex align-items-center justify-content-between">
      <span class="fw-semibold small text-uppercase text-secondary">Pipeline</span>
      <span id="pipeline-state" class="small"></span>
    </div>
    <div class="card-body d-flex flex-wrap gap-2 align-items-center">
      <button id="btn-pause" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pause-fill"></i> Pause model stages</button>
      <button id="btn-resume" class="btn btn-sm btn-outline-secondary"><i class="bi bi-play-fill"></i> Resume</button>
      <button id="btn-retry-parked" class="btn btn-sm" style="background: var(--oaken-acorn); color:#fff;"><i class="bi bi-arrow-counterclockwise"></i> Retry all parked</button>
      <span class="ms-auto small text-secondary" id="pipeline-summary"></span>
    </div>
  </div>

  <!-- Stages: pause one, or change how many of its jobs run at once -->
  <div class="card mb-3">
    <div class="card-header"><span class="fw-semibold small text-uppercase text-secondary">Stages</span></div>
    <div class="table-responsive">
      <table class="table table-sm mb-0" id="stage-table">
        <thead><tr><th>Stage</th><th>Pending</th><th>Running</th><th>Failed</th><th>Per second</th><th>State</th><th>At once</th><th></th></tr></thead>
        <tbody id="stage-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Jobs -->
  <div class="card mb-3">
    <div class="card-header d-flex align-items-center justify-content-between">
      <span class="fw-semibold small text-uppercase text-secondary">Jobs</span>
      <div class="d-flex gap-2 align-items-center">
        <select id="status-filter" class="form-select form-select-sm" style="width:auto;">
          <option value="">All</option>
          <option value="queued">Queued</option>
          <option value="running">Running</option>
          <option value="failed">Failed</option>
          <option value="cancelled">Cancelled</option>
          <option value="succeeded">Succeeded</option>
        </select>
        <button id="btn-refresh" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-sm mb-0" id="jobs-table">
        <thead><tr><th>Job</th><th>Kind</th><th>Status</th><th>Attempts</th><th>Error</th><th class="text-end">Actions</th></tr></thead>
        <tbody id="jobs-body"><tr><td colspan="6" class="text-secondary">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="result" class="alert d-none" role="status"></div>
</main>

<script src="/jobs.js"></script>
</body>
</html>
