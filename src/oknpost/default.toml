# Oaken Mail's starting config: written to your config folder the first time `oknpost` runs, then yours to edit.

[jobs]
# An item nobody can format stays in Intake's failed jobs (shown on the console, kept to requeue) instead of passing on as non-mail.
unmatched_format = "fail"
failed_format = "fail"

# Mail in: Intake splits a message into parts (the rfc822 formatter) and the mail ingestor stores it under its Message-ID, threaded. Both load
# by themselves. Gmail, IMAP and SMTP are templates: make one instance per account with the + on the Providers page (or `oknpost plugin add provider.gmail --name ACCOUNT`, and likewise for `imap` and `smtp`).
