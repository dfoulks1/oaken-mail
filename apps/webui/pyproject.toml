[project]
name = "oaken-webui"
dynamic = ["version"]  # one source of truth: src/oaken/__init__.py (shared across the product)
description = "The Oaken Mail web UI server: a thin client that serves the browser UI and proxies to the core daemon's API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["oaken", "email", "mail", "webui", "local-first", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "oaken",
    "oaken-cli",
    "starlette",
    "uvicorn",
    "httpx2",
]

[project.scripts]
oaken-webui = "oaken_webui:main"

[tool.uv.sources]
oaken = { workspace = true }
oaken-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Lockstep version from the one source of truth (ADR 0014); see oaken-cli for the rationale.
[tool.hatch.version]
source = "regex"
path = "../../src/oaken/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_webui"]
# The browser UI (HTML/CSS/JS) ships inside the wheel so the server can serve it with no extra
# files; the demo mockups live under docs/ and are not packaged.
force-include = { "oakenmail-templates" = "oaken_webui/ui" }
exclude = ["**/tests/**"]
