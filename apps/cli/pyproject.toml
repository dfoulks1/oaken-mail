[project]
name = "oaken-cli"
version = "0.1.0"
description = "The oaken command line: a thin client of the Oaken Mail core daemon."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "oaken",
    "rich>=13",
]

[project.scripts]
oaken = "oaken_cli:main"

[tool.uv.sources]
oaken = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_cli"]
exclude = ["**/tests/**"]
