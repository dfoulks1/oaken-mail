[project]
name = "oaken-cli"
dynamic = ["version"]  # one source of truth: src/oaken/__init__.py (the whole product shares it)
description = "The oaken command line: a thin client of the Oaken Mail core daemon."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "oaken",
    "rich>=13",
]

[project.scripts]
oaken = "oaken_cli:main"

[tool.uv.sources]
oaken = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The product releases in lockstep (ADR 0014); every distribution reads its version from the one
# place oaken declares it, so a single bump moves them all and they can never drift.
[tool.hatch.version]
source = "regex"
path = "../../src/oaken/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_cli"]
exclude = ["**/tests/**"]
