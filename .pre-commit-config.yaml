repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^docs/(.*\.html|sitemap\.xml)$  # generated; SRI hashes look like secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: local
    hooks:
      - id: lint-imports
        name: import boundaries (import-linter)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$
