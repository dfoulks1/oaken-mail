name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      # Oaken Mail develops against checkouts of its parts beside it (see [tool.uv.sources]): put the three side by side.
      - uses: actions/checkout@v4
        with:
          path: oaken-mail
      - uses: actions/checkout@v4
        with:
          repository: dfoulks1/oaken-core
          path: oaken-core
      - uses: actions/checkout@v4
        with:
          repository: dfoulks1/oaken-plugins
          path: oaken-plugins
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
        working-directory: oaken-mail
      - run: uv run pytest
        working-directory: oaken-mail
