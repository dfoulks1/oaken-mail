# --- Ingest ------------------------------------------------------------------------------
[[components]]
id = "ingest"
name = "Ingest pipeline"
layer = "ingest"
status = "built"
prompt = "09"
path = "src/oaken/ingest"
summary = "Staged, idempotent, resumable: store, then Sieve filter and index (keyword-searchable from here), then embed and enrich asynchronously. Every stage skips work whose content hash it has already done."
uses = ["parsing", "sieve", "jobs", "events", "pluginhost", "rawstore", "index", "vectorstore"]
untrusted = true
types = [
  ["Pipeline", "class", "Registers the ingest.parse, .embed, .enrich and .reprocess jobs; embed_message, enrich_message, reprocess, backfill_paused and pipeline_status."],
  ["SyncRunner", "class", "Pulls from a provider, stores each message, queues parse, saves the cursor only after the batch. A backfill pauses at the queue cap; new mail never does."],
  ["Backends", "dataclass", "Callables for the embedder, LLM, enrichers and vector store, so plugins can come and go while the pipeline runs."],
  ["Vectors", "class", "The one seam between core and a vector store. Optional store capabilities (stored_hashes, begin_model, activate_model, drop_model, prune_orphans) are detected, not required."],
  ["UsageStore", "class", "ai_usage in raw.db: calls, cached calls, tokens in and out, and tokens saved by caching."],
  ["Quarantine", "class", "Writes flagged attachments to an owner-only folder. Never reads, parses or runs them."],
  ["PipelineStatus", "frozen dataclass", "Per-stage counts, embedding speed, backfill state and the parked (failed) jobs with reasons."],
]
funcs = [
  ["Pipeline.reprocess(stage) -> job id", "One low-priority job per stage and account; parse queues index.rebuild, embed swaps models without removing the old vectors first."],
  ["SyncRunner.sync(account, provider) -> SyncResult", "Stored, unchanged, deleted, flag changes, paused and errors. Provider errors are reported, not raised."],
  ["UsageStore.usage_summary(since) -> list[UsageRow]", "Per stage and model; enrichment tokens are estimates."],
  ["PluginContext.subscribe(event_type, handler)", "Plugins listen to core and plugin events, read-only; the host ends them when the plugin stops."],
]
notes = ["Order is filter first, so discarded or skip_enrich mail never reaches the model stages. Embed runs at priority-1 and enrich at priority-2 of the parse job.", "Failures retry with backoff up to ingest.stage_max_attempts, then are parked and shown in pipeline_status. Keyword search works throughout an outage.", "A changed embedder model leaves embed jobs 'stale' until reprocess('embed'); new mail during a swap is embedded to the building model only.", "Enrichments live in raw.db (they cost model time); index.db stays disposable.", "Several vector stores: only the Vectors seam exists; split and caps are planned (see 08 notes).", "docs.cleaned_text is duplicated with chunks.text for now; pointers are a later prompt."]

[[components]]
id = "quarantine"
name = "Attachment quarantine"
layer = "ingest"
status = "built"
prompt = "09"
path = "src/oaken/ingest/quarantine.py"
summary = "Flagged attachments are written, never read back, to a 0700 folder as 0600 .quarantined files named so they cannot escape or execute. Over-size attachments stay in the message."
uses = ["parsing"]
untrusted = true
notes = ["The one place attachment bytes leave raw.db without being asked for; the user chose this in 09. Switch off with mail.attachments.quarantine = false.", "problems() checks modes only."]

[[components]]
id = "parsing"
name = "Parsing"
layer = "ingest"
status = "built"
prompt = "06"
path = "src/oaken/mail"
summary = "RFC 822 to structured fields and cleaned text (quotes, signatures and boilerplate removed); thread keys; token counts. Pure and deterministic: no database, no network, no model."
uses = []
untrusted = true
types = [
  ["ParsedMessage", "frozen dataclass", "Headers, addresses, ids, UTC date, text and HTML bodies, attachment metadata, forwarded messages and warnings. parse() never raises."],
  ["CleanedText", "frozen dataclass", "Tagged segments, the cleaned text (new content only), chars and tokens in and out, and untrusted() for the model boundary."],
  ["ThreadInfo", "frozen dataclass", "The thread key, a subject key for the index to join reference-less replies, and how the key was derived."],
  ["AttachmentInfo", "frozen dataclass", "Filename, type, size, content-id, inline, quarantine flag and part path. Never the bytes."],
  ["Tokenizer", "Protocol", "count(text) -> int. An estimate by default; exact from a local tokenizer.json."],
]
funcs = [
  ["parse(raw, settings) -> ParsedMessage", "Standard-library parser with policy.default; malformed mail becomes warnings."],
  ["clean(parsed, settings, tokenizer) -> CleanedText", "Pick plain or HTML, then tag quotes, signatures, footers, disclaimers and boilerplate by named rules."],
  ["thread_key(parsed, settings) -> ThreadInfo", "Stateless key from References, In-Reply-To or Message-ID, with a configurable subject fallback."],
  ["html_to_text(html) -> str", "selectolax: drops scripts, hidden preheaders and tracking pixels; keeps lists, tables, quotes and links."],
  ["read_attachment(raw, part_path) -> bytes", "The explicit, on-demand door to an attachment's bytes; nothing in ingest calls it."],
]
notes = ["Every cleaning rule has a name and can be switched off or extended in [mail.cleaning].", "Attachments are flagged for quarantine by name and type and are never analysed unless asked."]

