# Software map data. The page "Software map" is generated from this file, and the docs build
# fails if it contradicts the repository or the architecture. Edit it in the same change that
# builds or alters a component.
#
# Stacks are separate pieces of software; each lists its layers, top to bottom. A layer's
# components are laid out in the order listed, six to a row.
#
# Component keys
#   status     built | partial | planned
#              built/partial -> `path` must exist; planned -> `path` must not exist yet
#   prompt     the build prompt that delivers it (links to docs/prompts/<prompt>-*.md); "later" if unwritten
#   uses       direct calls into other components: same layer or lower, never up, no cycles
#   notifies   events or callbacks the component raises to components strictly ABOVE it
#   untrusted  true if it handles mail text, remote data or other unvetted input
#   types / funcs / ext / notes   optional detail, filled in as the component is built
#                types = [[name, kind, meaning]]   funcs = [[signature, meaning]]

[[stacks]]
id = "clients"
name = "Thin clients"
layers = ["clients"]

[[stacks]]
id = "core"
name = "Core daemon (one asyncio process)"
layers = ["api", "services", "ingest", "runtime", "plugins", "storage", "foundation"]

[[stacks]]
id = "project"
name = "Project tooling"
layers = ["project"]

[[layers]]
id = "clients"
name = "Clients"

[[layers]]
id = "api"
name = "Local API"

[[layers]]
id = "services"
name = "Operations and services"

[[layers]]
id = "ingest"
name = "Ingest"

[[layers]]
id = "runtime"
name = "Runtime"

[[layers]]
id = "plugins"
name = "Plugins"

[[layers]]
id = "storage"
name = "Storage"

[[layers]]
id = "foundation"
name = "Foundation"

[[layers]]
id = "project"
name = "Tooling"

# --- Clients -----------------------------------------------------------------------------
[[components]]
id = "cli"
name = "CLI"
layer = "clients"
status = "partial"
prompt = "17"
path = "src/oaken/cli.py"
summary = "Thin command-line client of the local API. Today it only prints the version."
uses = ["api"]
funcs = [["main() -> None", "Entry point of the `oaken` command; prints the version for now."]]
notes = ["Does not auto-start core. If the daemon is not running it says so and exits."]

[[components]]
id = "mcpbridge"
name = "MCP stdio bridge"
layer = "clients"
status = "planned"
prompt = "18"
summary = "`oaken mcp`: lets stdio-only MCP clients reach the in-core MCP server. Adds no behaviour of its own."
uses = ["mcp"]
notes = ["Does not start core and never opens the databases."]

[[components]]
id = "webui"
name = "Web UI"
layer = "clients"
status = "planned"
prompt = "later"
summary = "Browser client served by core. The framework choice is deferred until this phase."
uses = ["api"]

# --- Local API ---------------------------------------------------------------------------
[[components]]
id = "api"
name = "API daemon"
layer = "api"
status = "planned"
prompt = "16"
summary = "General local API for the CLI and web UI: HTTP and server-sent events on 127.0.0.1 with token auth; start, stop and status."
uses = ["operations"]
untrusted = true
notes = ["Binds to loopback only. The token file is mode 0600 under the config directory."]

[[components]]
id = "mcp"
name = "MCP server"
layer = "api"
status = "planned"
prompt = "18"
summary = "The AI-enabled surface of core's API and the heart of the product: a local, data-only MCP server for sensitive mail. Tools are generated from the operation registry; sending is never exposed."
uses = ["operations"]
untrusted = true
notes = ["Runs whether or not the web UI does. Its own token, caller class and limits (ADR 0004).", "Mounted at /mcp on the loopback listener; `[api] mcp = false` removes it."]

# --- Operations and services -------------------------------------------------------------
[[components]]
id = "operations"
name = "Operation registry"
layer = "services"
status = "planned"
prompt = "13"
summary = "Typed operations with permission classes and the confirm gate. HTTP and MCP surfaces are generated from it."
uses = ["retrieval", "readstate", "audit", "jobs"]
notes = ["Anything that mutates mail is gated here, in code, not in a prompt."]

[[components]]
id = "retrieval"
name = "Retrieval and ask"
layer = "services"
status = "planned"
prompt = "15"
summary = "Hybrid keyword and vector search, token-budgeted context and cited question answering."
uses = ["index", "pluginhost"]

[[components]]
id = "readstate"
name = "Read state"
layer = "services"
status = "planned"
prompt = "12"
summary = "Marks mail read only when the user opens or summarizes it; writes back to the provider with undo."
uses = ["audit", "rawstore", "pluginhost"]

[[components]]
id = "audit"
name = "Audit log"
layer = "services"
status = "planned"
prompt = "12"
summary = "Records every state-changing action, with undo where possible."
uses = ["rawstore"]

# --- Ingest ------------------------------------------------------------------------------
[[components]]
id = "ingest"
name = "Ingest pipeline"
layer = "ingest"
status = "planned"
prompt = "09"
summary = "Staged, idempotent, resumable: a message is keyword-searchable first, then embedded and enriched asynchronously."
uses = ["parsing", "jobs", "events", "pluginhost", "rawstore", "index"]
untrusted = true

[[components]]
id = "parsing"
name = "Parsing"
layer = "ingest"
status = "planned"
prompt = "06"
summary = "RFC 822 to structured fields and cleaned text (quotes, signatures and boilerplate removed); threading keys."
uses = []
untrusted = true

# --- Runtime -----------------------------------------------------------------------------
[[components]]
id = "events"
name = "Event bus"
layer = "runtime"
status = "built"
prompt = "03"
path = "src/oaken/core/events.py"
summary = "In-memory, typed events. Handlers are never dropped; client streams are bounded and drop the oldest."
uses = []
notifies = ["api", "ingest"]
types = [
  ["Event", "frozen dataclass", "Base of every event: ts and a UUIDv7 event_id; subclasses add account_id and fields."],
  ["EventStream", "async iterator", "Bounded drop-oldest queue for one client; counts what it dropped."],
]
funcs = [
  ["EventBus.subscribe(type, handler)", "Internal handler for an event type; failures are logged, never propagated."],
  ["EventBus.publish(event)", "Deliver to every handler and stream; never blocked by a slow stream."],
  ["EventBus.stream(filter)", "An async iterator of events, for SSE later."],
]

[[components]]
id = "jobs"
name = "Job queue"
layer = "runtime"
status = "built"
prompt = "03"
path = "src/oaken/core/jobs.py"
summary = "Durable queue in raw.db that survives crashes and restarts: leases, retries with backoff, dedupe, priority and per-kind concurrency."
uses = ["dbaccess", "events"]
notifies = ["ingest"]
types = [
  ["Job", "frozen dataclass", "One row of the jobs table."],
  ["JobQueue", "class", "Enqueue, claim with a lease, heartbeat, complete, fail, cancel."],
  ["JobRunner", "class", "N asyncio workers; handlers register by kind with a pydantic payload model."],
  ["PermanentJobError", "exception", "Raised by a handler to fail without retrying."],
]
funcs = [
  ["JobQueue.enqueue(kind, payload, dedupe_key=...)", "Idempotent while an equal key is queued or running."],
  ["JobRunner.register(kind, model, handler, concurrency=...)", "Run handler(payload, job) for jobs of this kind."],
  ["JobRunner.drain()", "Run everything runnable now; used by tests with a fake clock."],
]
notes = ["Delivery is at least once, so handlers must be idempotent.", "See architecture/jobs for the lifecycle."]

[[components]]
id = "swarm"
name = "Agents and the swarm"
layer = "runtime"
status = "built"
prompt = "03b"
path = "src/oaken/core/agents.py"
summary = "Optional external workers with their own scoped tokens and quotas. Opt-in per job kind, results validated before they are stored."
uses = ["jobs", "dbaccess", "events"]
types = [
  ["Agent", "frozen dataclass", "An external worker: label, kinds, accounts, quotas, revocation."],
  ["AgentRegistry", "class", "Create (token shown once, only its hash stored), authenticate, list, revoke."],
  ["Actor", "frozen dataclass", "Who did something: user, agent or system."],
]
funcs = [
  ["JobQueue.claim(..., agent=agent)", "Scope and quota checks inside the claim transaction."],
  ["JobQueue.complete(job, worker, result, produced_by=)", "Validates the result against the kind's schema before storing it."],
]
notes = ["Off by default; a kind is offered to agents only if listed in [swarm] allowed_kinds.", "The HTTP, MCP and CLI claim operations come with prompts 16 to 18."]

[[components]]
id = "scheduler"
name = "Scheduler"
layer = "runtime"
status = "built"
prompt = "03"
path = "src/oaken/core/scheduler.py"
summary = "Recurring work (interval or cron, UTC) with a persisted next_run, so restarts neither repeat nor skip; replaces APScheduler."
uses = ["jobs"]
funcs = [
  ["Scheduler.add(name, kind, payload, every= | cron=)", "Create or update a schedule; idempotent at start-up."],
  ["Scheduler.tick()", "Enqueue every due schedule and advance next_run in one transaction."],
]

[[components]]
id = "pluginhost"
name = "Plugin host"
layer = "runtime"
status = "built"
prompt = "04"
path = "src/oaken/plugins/host.py"
summary = "Entry-point discovery, validation, lifecycle, capabilities and health for the five plugin contracts. Fakes and reusable contract suites live in oaken.testing."
uses = ["events", "provider", "embedder", "llm", "enrichers", "vectorstore"]
types = [
  ["PluginHost", "class", "Loads, starts, health-checks and stops plugins; looks them up by kind and name."],
  ["PluginInfo", "frozen dataclass", "Name, version, kind, capabilities and api_version of a loaded plugin."],
  ["BaseProvider, BaseEmbedder, ...", "classes", "Optional base classes with defaults; capabilities are inferred from the methods overridden."],
]
funcs = [
  ["PluginHost.providers_with(capability)", "Healthy providers that implement a capability. Sending is never routed."],
  ["adapt.to_batch(obj, who)", "Accept a dict, list or dataclass from a plugin and return the strict type, or a readable PluginError."],
  ["verify_provider(make, ids)", "Run the whole provider contract suite in one call (one verify_* per kind)."],
]
notes = ["Core never imports provider code; a plugin never touches the databases.", "Plugins run in-process and are not sandboxed in v1."]

