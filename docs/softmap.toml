# --- Call flows --------------------------------------------------------------------------
# Each step is [from, to, what happens, note]. Every step must follow a declared relationship.

[[flows]]
id = "sync"
title = "A message arrives (sync and ingest)"
steps = [
  ["scheduler", "jobs", "enqueue a sync job", "Durable, so a crash loses nothing."],
  ["jobs", "ingest", "run the job handler", "A registered callback."],
  ["ingest", "pluginhost", "provider.pull", "Core never calls the provider directly."],
  ["pluginhost", "provider", "fetch new messages", "Returns raw bytes and provider ids."],
  ["ingest", "rawstore", "store the raw message", "Content-addressed, so a retry is idempotent."],
  ["ingest", "parsing", "parse and clean", "Treated as untrusted input."],
  ["ingest", "sieve", "run the user's Sieve scripts", "Labels, flags and a disposition, saved in raw.db. Nothing is sent or deleted."],
  ["ingest", "index", "write fields and FTS5", "Searchable by keyword from here."],
  ["ingest", "jobs", "enqueue embed and enrich", "Asynchronous, resumable, cached."],
  ["ingest", "events", "emit message.ingested", "Clients watching the SSE stream see it."],
]

[[flows]]
id = "ask"
title = "Ask your mailbox a question"
steps = [
  ["cli", "api", "POST the question", "Token-authenticated, loopback only."],
  ["api", "operations", "dispatch the ask operation", "Permission class: read-only."],
  ["operations", "retrieval", "ask", ""],
  ["retrieval", "index", "keyword search", "FTS5 candidates."],
  ["retrieval", "pluginhost", "embed the query and search vectors", "Only the top chunks go to the model."],
  ["pluginhost", "embedder", "embed", ""],
  ["pluginhost", "vectorstore", "nearest chunks", ""],
  ["pluginhost", "llm", "answer from the chunks", "Mail is wrapped as UntrustedText."],
  ["llm", "safety", "wrap and cache", "Cached by (content hash, model, prompt version)."],
]

[[flows]]
id = "read"
title = "Open a message (mark as read)"
steps = [
  ["cli", "api", "POST open", "A user-initiated action."],
  ["api", "operations", "dispatch the open operation", "Confirm gate applies to anything that mutates."],
  ["operations", "readstate", "mark read", "Never done by background work."],
  ["readstate", "rawstore", "record the read-state intent", "Survives a failed write-back."],
  ["readstate", "audit", "log the change", "So it can be undone."],
  ["readstate", "pluginhost", "flags.write", ""],
  ["pluginhost", "provider", "write the flag to the provider", ""],
]

# --- Open points -------------------------------------------------------------------------

[[open]]
title = "OAuth refresh tokens expiring"
text = "Having to re-authenticate every day or so is untenable. Prompt 11 must keep the refresh token alive: publish the OAuth app out of Testing mode (Testing-mode refresh tokens expire after 7 days), refresh access tokens silently, and fail clearly on invalid_grant."

[[open]]
title = "SQLite driver"
text = "Standard sqlite3 in a dedicated executor, or aiosqlite. Prompt 02 decides and records an ADR."

[[open]]
title = "sqlite-vec"
text = "Prompt 08 starts with a spike to confirm it loads on Linux, macOS and Windows before the VectorStore plugin is built on it."

[[open]]
title = "Embedding throughput on CPU"
text = "Not yet measured. Tuning is deliberately out of scope until there is real mail to ingest."

[[open]]
title = "Web UI framework"
text = "Deferred until the UI phase. Core serves the built UI files."

[[open]]
title = "Plugin sandboxing"
text = "Plugins are in-process and first-party only in v1. Isolation is a later decision."
