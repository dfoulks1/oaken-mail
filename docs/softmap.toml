notes = ["OAKEN_HOME relocates every path under one root; tests rely on it.", "Database files are created owner-only (0600) before SQLite opens them, so -wal and -shm inherit it."]

[[components]]
id = "safety"
name = "Prompt safety"
layer = "foundation"
status = "built"
prompt = "10"
path = "src/oaken/ai"
summary = "Mail reaches a model only as UntrustedText in a fenced, per-call-nonce block; instructions are constants. Answers are validated against a pydantic schema, with one repair retry. Results are cached per workspace."
uses = []
types = [
  ["UntrustedText", "frozen dataclass", "Mail-derived text with no implicit str; render() fences it with a fresh nonce and neutralizes forged delimiters."],
  ["PromptBuilder", "class", "One LLM task: constant instructions, answer model, version (plus a hash of the text) and token cap."],
  ["SafeOutput", "pydantic model", "Base of every answer: carries injection_suspected."],
  ["LLMService", "class", "generate_cached(): the only door enrichers use. Cache, backend call, validation, one repair, usage."],
  ["LLMCache", "class", "llm_cache in raw.db, keyed by workspace, task, content hash, model and prompt version."],
  ["Workspaces", "class", "Named profiles (secure or insecure) that partition the cache and usage and gate the backend."],
]
funcs = [
  ["UntrustedText.render(label)", "The only way to put mail in a prompt; strips invisible characters and look-alike brackets."],
  ["LLMService.generate_cached(builder, *parts, content_hash, workspace)", "Returns a validated answer, from the cache when it can."],
  ["Workspaces.for_account(raw, account_id)", "The workspace named in the account's config, else default."],
]
notes = ["A secure workspace refuses any backend that does not declare locality = local.", "The AST lint test fails any module that builds an LLMRequest from a raw string.", "Test live later: the unit tests prove what is sent, not that a model obeys it."]

[[components]]
id = "ollama"
name = "Ollama plugin"
layer = "plugins"
status = "built"
prompt = "10"
path = "src/oaken_ollama"
summary = "The first-party embedder and LLM backend for a local Ollama. Loopback only unless ai.allow_remote is set; never pulls a model; structured output through Ollama's format schema."
uses = ["safety"]
ext = ["Ollama"]
types = [
  ["OllamaEmbedder", "class", "The oaken.embedders plugin: batches, discovers dimensions with a probe."],
  ["OllamaLLM", "class", "The oaken.llm_backends plugin (ollama and ollama-remote): chat with a JSON schema, token counts, locality."],
  ["OllamaConfig", "pydantic model", "[plugins.ollama]: base_url, model, keep_alive, timeout, max_retries, backoff, batch_size."],
]
funcs = [
  ["start(ctx)", "Checks the address, that the model is installed (else prints ollama pull NAME), and its context size."],
  ["is_loopback(url)", "True only for localhost, 127.0.0.0/8 and ::1."],
]
notes = ["Retries only connection errors and 5xx. Error messages never carry request or response bodies.", "Default models nomic-embed-text and qwen2.5:3b are unverified placeholders; test live later.", "Fixtures are written from the API docs, not recorded."]

[[components]]
id = "gmail"
name = "Gmail plugin"
layer = "plugins"
status = "built"
prompt = "11"
path = "src/oaken_gmail"
summary = "The first-party Gmail provider: full and incremental sync, flags, labels, trash, archive, star and send, over Google's REST API with a bring-your-own OAuth client. The refresh token lives only in the OS keyring."
uses = []
ext = ["Gmail API", "OS keyring"]
types = [
  ["GmailProvider", "class", "The oaken.providers plugin: authenticate, pull, set_flags, send, plus labels, trash, archive and star."],
  ["TokenManager", "class", "Keeps an access token valid: proactive renewal, one shared refresh, 401 retry, rotation, invalid_grant becomes a health state."],
  ["KeyringStore", "class", "The refresh token in the OS keyring (service oaken, user gmail:ACCOUNT); no keyring means a clear error, never a file."],
  ["GmailApi", "class", "REST client: timeouts, a concurrency cap, backoff on 429, rate-limit 403 and 5xx, Retry-After, one 401 retry."],
  ["Cursor", "dataclass", "Sync position: a full sync's page (with the history id read before listing) or an incremental history id."],
  ["GmailConfig", "pydantic model", "[plugins.gmail]: client_secret_file, account, include and exclude labels, page_size, concurrency, timeout, retries."],
]
funcs = [
  ["GmailProvider.authorize(show_url)", "PKCE loopback OAuth in the browser; stores the refresh token in the keyring."],
  ["GmailProvider.set_flags(ids, add, remove)", "Seen is the UNREAD label's absence, Flagged is STARRED; one batchModify, per-id fallback with PartialFailure."],
  ["GmailProvider.send(raw)", "messages.send; never retried after a timeout or 5xx, since the mail may have gone."],
]
notes = ["Scope is gmail.modify only; no permanent delete and no drafts.", "invalid_grant sets needs re-authorization, publishes an event and stops asking until the token changes. A Testing-mode Google app expires tokens in 7 days.", "Spam and Trash are never synced; moving a message there reports it deleted.", "Test live later: the fake server proves the requests, not that Google accepts them."]

[[components]]
id = "smtp"
name = "SMTP send plugin"
layer = "plugins"
status = "built"
prompt = "11b"
path = "src/oaken_smtp"
summary = "A provider that only sends: it submits a message through your own SMTP server over STARTTLS or implicit TLS, never in the clear. It declares only auth and send. The password lives only in the OS keyring."
uses = []
ext = ["SMTP server", "OS keyring"]
types = [
  ["SmtpProvider", "class", "The oaken.providers plugin: authenticate (log in once, send nothing) and send. One connection per send."],
  ["SendFailed", "exception", "What a refused or failed send raises: accepted and refused recipients with the server's codes, and transient (4xx, network) versus permanent (5xx, TLS)."],
  ["AuthRequired", "exception", "The password is missing or was rejected; storing a new one fixes it, retrying does not."],
  ["KeyringStore", "class", "The password in the OS keyring (service oaken, user smtp:ACCOUNT); no keyring means a clear error, never a file."],
  ["SmtpConfig", "pydantic model", "[plugins.smtp]: host, port, security (starttls or tls only), username, from_address, account, timeout."],
]
funcs = [
  ["prepare(raw, from_address)", "The envelope and bytes to submit: Bcc goes to the envelope only and is removed from the headers, a Message-ID is added if missing, nothing else changes."],
  ["SmtpProvider.send(raw)", "Returns the Message-ID. A partial refusal raises SendFailed listing who got it, so a retry can skip them."],
]
notes = ["There is no plaintext option. A server that does not offer STARTTLS is refused before the password is sent, and certificates are always checked.", "A wrong password (530, 534, 535, 538) makes the plugin unhealthy and publishes an event; no attempt is made again until a different password is stored.", "Test live later: the in-process fake server proves the protocol handling, not that your provider accepts it."]

[[components]]
id = "imap"
name = "IMAP provider"
layer = "plugins"
status = "built"
prompt = "11c"
path = "src/oaken_imap"
summary = "A generic IMAP provider for any server: it mirrors every folder except Trash and Junk, finds new, deleted and changed mail per folder, and writes back flags, Trash, Archive and moves. TLS is always on and the password lives only in the OS keyring. It cannot send."
uses = []
ext = ["IMAP server", "OS keyring", "imapclient (BSD)"]
types = [
  ["ImapProvider", "class", "The oaken.providers plugin: authenticate, pull, set_flags, plus trash, archive and move. One connection per pull or write."],
  ["ImapConfig", "pydantic model", "[plugins.imap]: host, port, security (tls or starttls only), username, account, folder include and exclude lists, trash and archive folders, page_size, flag_scan_limit, timeout."],
  ["Cursor", "dataclass", "Per folder: UIDVALIDITY, the highest mod-sequence read, and the UIDs delivered as ranges."],
  ["Session", "class", "One TLS-only connection: login, LIST, SELECT, UID SEARCH, FETCH, STORE, COPY, MOVE and EXPUNGE, with replies parsed to plain values."],
  ["AuthRequired", "exception", "The password is missing or was rejected; storing a new one fixes it, retrying does not."],
  ["PartialFailure", "exception", "Some messages changed and some did not; failed maps each message id to why."],
  ["KeyringStore", "class", "The password in the OS keyring (service oaken, user imap:ACCOUNT); no keyring means a clear error, never a file."],
]
funcs = [
  ["ImapProvider.pull(cursor)", "New mail is the server's UIDs minus the delivered ones, deletions the reverse; flag changes come from CONDSTORE or a capped re-read; a changed UIDVALIDITY re-reads the folder."],
  ["folders.to_sync(all, config)", "The folders to mirror: selectable, not Trash or Junk (server attributes first, name guesses only when the server gives none), within the include and exclude lists."],
  ["ImapProvider.set_flags(ids, add, remove)", "UID STORE per folder; never sets \\Deleted; an id from a renumbered folder fails instead of acting on the wrong message."],
]
notes = ["No plaintext option. A server that does not offer STARTTLS is refused before the password is sent, and certificates are always checked.", "Messages are fetched with BODY.PEEK, so reading never marks them read.", "Without UIDPLUS or MOVE nothing is moved, because a plain EXPUNGE could destroy other mail marked deleted.", "Special-use folder markings come from the plain LIST reply; otherwise name guesses apply. imapclient is synchronous, so every call runs in a worker thread, one at a time.", "No IDLE and no QRESYNC yet: the scheduler polls, and deletions are found by comparing UID sets.", "Test live later: the in-process fake server proves the protocol handling, not that your provider accepts it."]

