<!doctype html>
<html lang="en" data-oaken-theme="oak-light" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · OakenMail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link href="assets/oaken.css" rel="stylesheet">
</head>
<body>

<div class="ok-auth">
  <div class="ok-auth-art">
    <div class="ok-brand fs-2">Oaken<span>Mail</span></div>
    <div style="position:relative;z-index:1;max-width:28rem">
      <div class="feather-bar mb-4"></div>
      <h1 class="display-6 fw-semibold mb-3">Mail for your community.</h1>
      <p class="opacity-75 mb-0">Read your lists, vote on releases, and keep in touch with your projects in one calm place.</p>
    </div>
    <div class="small opacity-50">Example Organization</div>
  </div>
  <div class="ok-auth-form">
    <form action="index.html">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0">Sign in</h2>
        <div class="dropdown"><button type="button" class="btn btn-ghost" data-bs-toggle="dropdown" aria-label="Theme"><i data-theme-icon class="bi bi-circle-half"></i></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button type="button" class="dropdown-item" data-theme-set="oak-light">Oak Light</button></li><li><button type="button" class="dropdown-item" data-theme-set="oak-dark">Oak Dark</button></li>
            <li><button type="button" class="dropdown-item" data-theme-set="birch">Birch</button></li><li><button type="button" class="dropdown-item" data-theme-set="system">System</button></li></ul></div>
      </div>
      <div class="mb-3"><label class="form-label" for="u">Username</label><input class="form-control form-control-lg" id="u" name="username" autocomplete="username" placeholder="username"></div>
      <div class="mb-3"><div class="d-flex"><label class="form-label" for="pw">Password</label><a class="ms-auto small" href="#">Forgot?</a></div>
        <input class="form-control form-control-lg" id="pw" name="password" type="password" autocomplete="current-password"></div>
      <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="rem"><label class="form-check-label" for="rem">Keep me signed in</label></div>
      <button class="btn btn-oaken btn-lg w-100 mb-3">Sign in</button>
      <button type="button" class="btn btn-outline-oaken btn-lg w-100"><i class="bi bi-shield-lock me-2"></i>Sign in with SSO</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="assets/oaken.js"></script>
</body>
</html>
