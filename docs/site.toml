# Site registry. Every Markdown file under docs/ must be listed here or excluded below,
# otherwise check_docs.py reports it as an orphan.

# Globs (relative to docs/, '*' crosses '/') that are not site content. docs/prompts/** and
# docs/tools/** are always excluded; the ADR sources are summarised by the generated ADR index.
exclude = ["adr/0*.md", "spikes/*.md", "evals/*.md"]

[site]
title = "Oaken Mail"
description = "A local-first, AI-native mail client."
repo = "https://github.com/dfoulks1/oaken-mail"
url = "https://dfoulks1.github.io/oaken-mail/"
branch = "main"
home = "index.md"

# Navigation groups, in display order.
[[groups]]
id = "start"
name = "Start"

[[groups]]
id = "concepts"
name = "Concepts"

[[groups]]
id = "reference"
name = "Reference"

[[groups]]
id = "project"
name = "Project"

# Extra hosts that outbound <a> links may point at, beyond github.com.
[check]
allow_hosts = ["console.cloud.google.com", "www.apache.org", "www.contributor-covenant.org", "www.jwz.org", "www.rfc-editor.org"]

