[project]
name = "oaken"
dynamic = ["version"]
description = "Oaken Mail: a local-first, AI-native mail client."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "httpx2>=2.15.1",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "selectolax>=1.0.1",
    "structlog>=26.1.0",
    "tokenizers>=0.23.3",
    "zstandard>=0.25.0",
]

[project.scripts]
oaken = "oaken.cli:main"

# First-party plugins register exactly as a third party's would.
[project.entry-points."oaken.embedders"]
ollama = "oaken_ollama:OllamaEmbedder"

[project.entry-points."oaken.llm_backends"]
ollama = "oaken_ollama:OllamaLLM"
ollama-remote = "oaken_ollama:OllamaLLM"

[project.entry-points."oaken.vector_stores"]
sqlite-vec = "oaken_vec_sqlite:SqliteVecStore"

[project.optional-dependencies]
vec = [
    "sqlite-vec>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/oaken/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken", "src/oaken_vec_sqlite", "src/oaken_ollama"]
exclude = ["**/tests/**"]

[dependency-groups]
dev = [
    "coverage",
    "detect-secrets",
    "hypothesis>=6.170.5",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "sqlite-vec>=0.1.9",
]
# Site tooling (docs/tools). The core runtime must not depend on it.
docs = [
    "jinja2",
    "markdown-it-py",
    "mdit-py-plugins",
    "pygments",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src", "docs", "tests"]
addopts = ["--import-mode=importlib", "-m", "not slow and not live_ollama"]
markers = [
    "slow: heavy measurements, off by default (run with -m slow)",
    "live_ollama: needs a running local Ollama with the models pulled, off by default",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "CPY"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-License-Identifier: Apache-2\\.0"
min-file-size = 0

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S311"]
"tests/**" = ["S101"]
"src/oaken/testing/contracts.py" = ["S101"]  # the suites are assertions
"docs/spikes/**" = ["S311", "S608"]  # measurement scripts: seeded random data, fixed SQL
"docs/tools/pagebase.py" = ["E501"]  # embedded CSS
"docs/tools/softmap.py" = ["E501"]  # embedded CSS, JS and HTML

[tool.mypy]
strict = true
files = ["src", "tests", "docs/tools"]
mypy_path = "docs/tools"

[[tool.mypy.overrides]]
module = ["pygments", "pygments.*", "sqlite_vec"]
ignore_missing_imports = true
