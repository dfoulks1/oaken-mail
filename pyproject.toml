[project]
name = "oaken-mail"
version = "1.0.0"
description = "Oaken Mail: Oaken Core with a coat of paint. A config bundle and a few filters; the work is core's and its plugins'."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["oaken-core", "oaken-plugins[imap,smtp]"]  # the extras bring the IMAP and SMTP client libraries

[project.scripts]
oknpost = "oknpost:main"  # the only command: `oaken` belongs to core and is not offered

# The plugins Oaken Mail loads, from oaken-plugins. Core finds a plugin to make instances of through entry points, so a template (Gmail)
# declared here can have any number of accounts added with `plugin add`; one declared only by a `class =` config table cannot.
[project.entry-points."oaken_core.providers"]
gmail = "oaken_plugins.provider_gmail:GmailProvider"
imap = "oaken_plugins.provider_imap:ImapProvider"
smtp = "oaken_plugins.provider_smtp:SmtpProvider"

[project.entry-points."oaken_core.formatters"]
rfc822 = "oaken_plugins.formatter_rfc822:Rfc822Formatter"

[project.entry-points."oaken_core.ingestors"]
mail = "oaken_plugins.ingestor_mail:MailIngestor"

# shortcut: sibling checkouts while core and its plugins are unreleased; use their PyPI versions once published.
[tool.uv.sources]
oaken-core = { path = "../oaken-core", editable = true }
oaken-plugins = { path = "../oaken-plugins", editable = true }

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oknpost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
