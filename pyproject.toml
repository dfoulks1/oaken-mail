[project]
name = "oaken"
dynamic = ["version"]
description = "Oaken Mail: a local-first, AI-native mail client."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "httpx2>=2.15.1",
    "imapclient>=4.1.0",
    "keyring>=25.7.0",
    "mcp>=1.0",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "selectolax>=1.0.1",
    "starlette>=1.9.0",
    "structlog>=26.1.0",
    "tokenizers>=0.23.3",
    "tzdata>=2025.2; sys_platform == 'win32'",  # Windows has no system tz database
    "uvicorn>=0.54.0",
    "zstandard>=0.25.0",
]

# First-party plugins register exactly as a third party's would.
[project.entry-points."oaken.embedders"]
ollama = "oaken_ollama:OllamaEmbedder"

[project.entry-points."oaken.enrichers"]
summary = "oaken_enrichers:SummaryEnricher"
triage = "oaken_enrichers:TriageEnricher"
actions = "oaken_enrichers:ActionsEnricher"
inspector = "oaken_enrichers:InspectorEnricher"

[project.entry-points."oaken.llm_backends"]
ollama = "oaken_ollama:OllamaLLM"
ollama-remote = "oaken_ollama:OllamaLLM"

[project.entry-points."oaken.providers"]
gmail = "oaken_gmail:GmailProvider"
smtp = "oaken_smtp:SmtpProvider"
imap = "oaken_imap:ImapProvider"

[project.entry-points."oaken.vector_stores"]
sqlite-vec = "oaken_vec_sqlite:SqliteVecStore"

[project.optional-dependencies]
vec = [
    "sqlite-vec>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/oaken/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken", "src/oaken_vec_sqlite", "src/oaken_ollama", "src/oaken_gmail", "src/oaken_smtp", "src/oaken_imap", "src/oaken_enrichers"]
exclude = ["**/tests/**"]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "coverage",
    "cryptography>=50.0.2",
    "detect-secrets",
    "hypothesis>=6.170.5",
    "mypy",
    "openapi-spec-validator>=0.9.0",
    "pytest",
    "pytest-asyncio",
    "oaken-cli",
    "oaken-webui",
    "ruff",
    "sqlite-vec>=0.1.9",
]
# Site tooling (docs/tools). The core runtime must not depend on it.
docs = [
    "jinja2",
    "markdown-it-py",
    "mdit-py-plugins",
    "pygments",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.workspace]
members = ["apps/cli", "apps/webui"]

[tool.uv.sources]
oaken-cli = { workspace = true }
oaken-webui = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src", "apps/cli", "apps/webui", "docs", "tests"]
addopts = ["--import-mode=importlib", "-m", "not slow and not live_ollama and not live_gmail and not live_smtp and not live_imap"]
markers = [
    "slow: heavy measurements, off by default (run with -m slow)",
    "live_ollama: needs a running local Ollama with the models pulled, off by default",
    "live_gmail: needs a real Google account and OAuth client, off by default",
    "live_smtp: needs a real SMTP server and password, off by default",
    "live_imap: needs a real IMAP server and password, off by default",
]
filterwarnings = [
    # The in-process SMTP test server (aiosmtpd) warns when it is told not to demand TLS for AUTH,
    # which it has to be for implicit TLS.
    "ignore:Requiring AUTH while not requiring TLS:UserWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "apps/cli/src", "apps/webui/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "CPY"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-License-Identifier: Apache-2\\.0"
min-file-size = 0

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]  # S105/6: fake tokens
"tests/**" = ["S101"]
"src/oaken/testing/contracts.py" = ["S101"]  # the suites are assertions
"docs/spikes/**" = ["S311", "S608"]  # measurement scripts: seeded random data, fixed SQL
"docs/tools/pagebase.py" = ["E501"]  # embedded CSS
"docs/tools/softmap.py" = ["E501"]  # embedded CSS, JS and HTML

[tool.mypy]
strict = true
files = ["src", "apps/cli/src", "apps/webui/src", "tests", "docs/tools"]
mypy_path = "docs/tools:apps/cli/src:apps/webui/src"

[[tool.mypy.overrides]]
module = ["pygments", "pygments.*", "sqlite_vec", "imapclient", "imapclient.*", "rich", "rich.*"]
ignore_missing_imports = true
