[project]
name = "oaken"
dynamic = ["version"]
description = "Oaken Mail: a local-first, AI-native mail client."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
# MCP/LLM/RAG have no trove classifier, so they live in keywords (free-form, searchable); the
# classifiers below are the real ones PyPI accepts.
keywords = ["email", "mail", "mua", "local-first", "ai", "mcp", "llm", "rag", "imap", "gmail", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Communications :: Email",
    "Topic :: Communications :: Email :: Email Clients (MUA)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "httpx2>=2.15.1",
    "imapclient>=4.1.0",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "mcp>=1.0",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "selectolax>=1.0.1",
    "starlette>=1.9.0",
    "structlog>=26.1.0",
    "tokenizers>=0.23.3",
    "tzdata>=2025.2; sys_platform == 'win32'",  # Windows has no system tz database
    "uvicorn>=0.54.0",
    "zstandard>=0.25.0",
]

# First-party plugins register exactly as a third party's would.
[project.entry-points."oaken.embedders"]
ollama = "oaken_ollama:OllamaEmbedder"

[project.entry-points."oaken.enrichers"]
summary = "oaken_enrichers:SummaryEnricher"
triage = "oaken_enrichers:TriageEnricher"
actions = "oaken_enrichers:ActionsEnricher"
inspector = "oaken_enrichers:InspectorEnricher"

[project.entry-points."oaken.llm_backends"]
ollama = "oaken_ollama:OllamaLLM"
ollama-remote = "oaken_ollama:OllamaLLM"

[project.entry-points."oaken.providers"]
gmail = "oaken_gmail:GmailProvider"
smtp = "oaken_smtp:SmtpProvider"
imap = "oaken_imap:ImapProvider"

[project.entry-points."oaken.vector_stores"]
sqlite-vec = "oaken_vec_sqlite:SqliteVecStore"

[project.optional-dependencies]
vec = [
    "sqlite-vec>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/oaken/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken", "src/oaken_vec_sqlite", "src/oaken_ollama", "src/oaken_gmail", "src/oaken_smtp", "src/oaken_imap", "src/oaken_enrichers"]
exclude = ["**/tests/**"]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "coverage",
    "cryptography>=50.0.2",
    "detect-secrets",
    "hypothesis>=6.170.5",
    "mypy",
    "openapi-spec-validator>=0.9.0",
    "pytest",
    "pytest-asyncio",
    "oaken-cli",
    "oaken-webui",
    "ruff",
    "sqlite-vec>=0.1.9",
    "import-linter>=2.15",
]
# Site tooling (docs/tools). The core runtime must not depend on it.
docs = [
    "markdown-it-py",
    "mdit-py-plugins",
    "pygments",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.workspace]
members = ["apps/cli", "apps/webui", "apps/core"]

[tool.uv.sources]
oaken-cli = { workspace = true }
oaken-webui = { workspace = true }
oaken-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src", "apps/cli", "apps/webui", "docs", "tests"]
addopts = ["--import-mode=importlib", "-m", "not slow and not live_ollama and not live_gmail and not live_smtp and not live_imap"]
markers = [
    "slow: heavy measurements, off by default (run with -m slow)",
    "live_ollama: needs a running local Ollama with the models pulled, off by default",
    "live_gmail: needs a real Google account and OAuth client, off by default",
    "live_smtp: needs a real SMTP server and password, off by default",
    "live_imap: needs a real IMAP server and password, off by default",
]
filterwarnings = [
    # The in-process SMTP test server (aiosmtpd) warns when it is told not to demand TLS for AUTH,
    # which it has to be for implicit TLS.
    "ignore:Requiring AUTH while not requiring TLS:UserWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "apps/cli/src", "apps/webui/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "CPY"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-License-Identifier: Apache-2\\.0"
min-file-size = 0

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]  # S105/6: fake tokens
"tests/**" = ["S101"]
"src/oaken/testing/contracts.py" = ["S101"]  # the suites are assertions
"docs/spikes/**" = ["S311", "S608"]  # measurement scripts: seeded random data, fixed SQL
"docs/tools/pagebase.py" = ["E501"]  # embedded CSS
"docs/tools/softmap.py" = ["E501"]  # embedded CSS, JS and HTML

[tool.mypy]
strict = true
files = ["src", "apps/cli/src", "apps/webui/src", "tests", "docs/tools"]
mypy_path = "docs/tools:apps/cli/src:apps/webui/src"

# Import boundaries (ADR 0002, 0006, 0007, 0010). Enforced by import-linter: `uv run lint-imports`.
# The rules encode the *intended* seams the code already relies on: core never imports a feature
# plugin or a client; a client reaches core only through the daemon lifecycle and a few leaf
# helpers; a feature plugin depends on the contract layer and shared leaf utilities, never the
# stores' orchestration, the registry, the API or the daemon. Test modules are exempt (the test
# rigs build a real Core on purpose) via the `**.tests.**` ignores.
[tool.importlinter]
root_packages = [
    "oaken",
    "oaken_cli",
    "oaken_webui",
    "oaken_gmail",
    "oaken_imap",
    "oaken_smtp",
    "oaken_ollama",
    "oaken_vec_sqlite",
    "oaken_enrichers",
]

# 1. Core never imports a feature plugin or a client (ADR 0002: "core never imports provider code").
[[tool.importlinter.contracts]]
name = "Core is independent of feature plugins and clients"
type = "forbidden"
source_modules = ["oaken"]
forbidden_modules = [
    "oaken_cli",
    "oaken_webui",
    "oaken_gmail",
    "oaken_imap",
    "oaken_smtp",
    "oaken_ollama",
    "oaken_vec_sqlite",
    "oaken_enrichers",
]
# Only core test modules may reference a plugin package (the shared ProviderContract rig does).
ignore_imports = ["oaken.**.tests.** -> **"]

# 2. Clients reach core only through the daemon lifecycle and sanctioned leaf helpers
#    (ADR 0006, 0007, 0010). The forbidden set is the parts a thin client must never reach into:
#    the stores, the pipeline/sync, the index, read state, the API app, the plugin host and the AI
#    layer. A client may import `oaken.daemon` (to start/stop/reload the process), `oaken.core`
#    leaves (errors, logging, settings, paths, clock, the caller/ids/events the in-process adapter
#    translates) and `oaken.api.runtime` (to find and check a running core).
[[tool.importlinter.contracts]]
name = "The CLI does not reach into core internals"
type = "forbidden"
source_modules = ["oaken_cli"]
# Direct imports only: the CLI legitimately imports `oaken.daemon` to start/stop/reload the
# process, and the daemon (the composition root) transitively pulls in all of core — that is not
# the CLI reaching in. What the CLI's own modules must never do is import a store, the API app or
# the plugin host directly. The in-process adapter's use of `oaken.core.operations` is the
# sanctioned seam (ADR 0006), so that package is not forbidden here.
allow_indirect_imports = "true"
forbidden_modules = [
    "oaken.api.app",
    "oaken.api.server",
    "oaken.api.guard",
    "oaken.api.mcp_server",
    "oaken.plugins",
    "oaken.ai",
    "oaken.ingest",
    "oaken.index",
    "oaken.mail",
    "oaken.readstate",
    "oaken.core.rawstore",
    "oaken.core.attrs",
    "oaken.core.db",
    "oaken.core.jobs",
    "oaken.core.scheduler",
    "oaken.core.mailbox",
    "oaken.core.agents",
]
ignore_imports = ["oaken_cli.tests.** -> **"]

[[tool.importlinter.contracts]]
name = "The web UI does not reach into core internals"
type = "forbidden"
source_modules = ["oaken_webui"]
allow_indirect_imports = "true"
forbidden_modules = [
    "oaken.api.app",
    "oaken.api.server",
    "oaken.api.guard",
    "oaken.api.mcp_server",
    "oaken.plugins",
    "oaken.ai",
    "oaken.ingest",
    "oaken.index",
    "oaken.mail",
    "oaken.readstate",
    "oaken.core.rawstore",
    "oaken.core.attrs",
    "oaken.core.db",
    "oaken.core.jobs",
    "oaken.core.scheduler",
    "oaken.core.mailbox",
    "oaken.core.agents",
    "oaken.daemon",
]
ignore_imports = ["oaken_webui.tests.** -> **"]

# 3. Feature plugins depend on the contract layer and shared leaf utilities, never the stores'
#    orchestration, the registry, the sync/ingest pipeline, the API or the daemon. First-party
#    infrastructure a plugin may reuse (documented, not a leak): a vector store sits beside the
#    index and uses `oaken.core.db`; an enricher reuses `oaken.mail` text/tokenizer helpers.
[[tool.importlinter.contracts]]
name = "Feature plugins depend only on the contract layer and shared leaves"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "oaken_gmail",
    "oaken_imap",
    "oaken_smtp",
    "oaken_ollama",
    "oaken_vec_sqlite",
    "oaken_enrichers",
]
forbidden_modules = [
    "oaken.api",
    "oaken.daemon",
    "oaken.ingest",
    "oaken.index",
    "oaken.readstate",
    "oaken.core.operations",
    "oaken.core.rawstore",
    "oaken.core.attrs",
    "oaken.core.jobs",
    "oaken.core.scheduler",
    "oaken.core.mailbox",
    "oaken.core.search",
    "oaken.core.agents",
]
ignore_imports = [
    "oaken_vec_sqlite.tests.** -> **",
    "oaken_enrichers.tests.** -> **",
]

[[tool.mypy.overrides]]
module = ["pygments", "pygments.*", "sqlite_vec", "imapclient", "imapclient.*", "rich", "rich.*", "importlinter", "importlinter.*"]
ignore_missing_imports = true
